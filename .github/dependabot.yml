version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, rust]

  - package-ecosystem: pub
    directory: /clients/game
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, flutter]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
