apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: kingdoms-of-dominion
spec:
  replicas: 4
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: kd/rust:1.0.0
          command: ["/usr/local/bin/gateway"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: kd-config }
            - secretRef: { name: kd-secrets }
          env:
            - { name: KD_HTTP_ADDR, value: "0.0.0.0:8080" }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: kingdoms-of-dominion
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: kingdoms-of-dominion
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 4
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
