# Static-analysis policy for the Flutter client.
#
# We build on flutter_lints and opt into a small set of additional rules that
# catch the bugs most common in a long-lived game client: leaked subscriptions,
# fire-and-forget futures, accidental prints, and inconsistent return types.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by scripts/gen_dart.sh from proto/kd.proto. Never hand-edit.
    - "lib/proto/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Keep TODOs visible without failing the build; track them in the issue tracker.
    todo: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_brace_in_string_interps
    - use_super_parameters
