name: kd_game
description: "Kingdoms of Dominion — native cross-platform 4X client (Flutter + Flame)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  grpc: ^5.2.0
  web_socket_channel: ^3.0.3
  flame: ^1.38.2
  http: ^1.6.0
  provider: ^6.1.5+1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/art/
